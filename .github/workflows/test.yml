name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false
      - name: Check formatting
        run: pnpm format:check
      - name: Check configuration schema
        run: pnpm config:schema
      - name: Check license evidence
        run: pnpm licenses:check
      - name: Check lint, types, and Effect diagnostics
        run: pnpm check
      - name: Install reporter browser prerequisites
        run: pnpm report:browser:install --with-deps
      - name: Run unit and integration tests
        run: pnpm test
      - name: Install browser prerequisites
        run: pnpm browser:install --with-deps
      - name: Run end-to-end tests
        run: pnpm test:e2e
      - name: Build plugin
        run: pnpm build
