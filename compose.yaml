services:
  memos:
    image: neosmemo/memos:26.11.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ABRACODE_MEMOS_PORT:-5230}:5230"
    volumes:
      - memos-data:/var/opt/memos
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5230/api/instance/profile"]
      interval: 10s
      start_period: 5s
      start_interval: 1s
      timeout: 3s
      retries: 3

volumes:
  memos-data:
