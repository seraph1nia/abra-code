[tools]
node = "24.21.0"
pnpm = "11.28.5"

[env]
# Use the CLI versions pinned in pnpm-lock.yaml.
_.path = ["{{ config_root }}/node_modules/.bin"]

[tasks.setup]
description = "Install project dependencies and verify the required CLIs"
run = ["pnpm install --frozen-lockfile --prod=false", "pnpm config:schema"]
